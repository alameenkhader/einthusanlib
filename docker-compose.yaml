services:
  nginx:
    image: alfg/nginx-rtmp
    ports:
      - "1935:1935"  # RTMP
      - "8080:8080"  # HTTP
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
    command: [nginx, '-g', 'daemon off;']
    networks:
      - streaming_network

networks:
  streaming_network:
    driver: bridge