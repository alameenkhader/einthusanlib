[tools]
ruby = "3.2.3"
python = "3.11"
"pipx:pre-commit" = "4.6.2"
"aqua:gitleaks/gitleaks" = "v8.30.1"
"aqua:trufflesecurity/trufflehog" = "v3.96.0"
"pipx:semgrep" = "1.173.0"

[env]
_.python.venv = { path = "venv", create = true, uv_create_args = ["--seed"] }

[tasks.setup]
description = "One-stop setup: venv, youtube-dl, gems, db, pre-commit hooks"
run = [
  "venv/bin/pip install youtube-dl",
  "bundle install",
  "bundle exec rake db:prepare",
  "pre-commit install",
]